<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" role="img" aria-labelledby="title desc">
  <title id="title">SimpleLime wide image fixture</title>
  <desc id="desc">A wide local image fixture used for HTML image and reference image checks.</desc>
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="0.55" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>
  <rect width="960" height="260" rx="24" fill="url(#g)"/>
  <path d="M84 178 C180 76 265 76 360 178 S540 280 676 112 S842 40 900 114" fill="none" stroke="#f8fafc" stroke-width="10" stroke-linecap="round"/>
  <text x="64" y="82" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="36" font-weight="700">Reference / HTML image fixture</text>
  <text x="64" y="128" fill="#dbeafe" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="22">If this shows as a real image, local relative image loading works.</text>
</svg>
