name: SimpleLime
options:
  bundleIdPrefix: com.whitehappypony
  deploymentTarget:
    iOS: "16.0"
packages:
  STTextView:
    url: https://github.com/krzyzanowskim/STTextView
    from: 2.3.10
targets:
  SimpleLime-iOS:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Resources/Assets.xcassets
      - path: Sources/SimpleLimeIOS
      - path: Sources/SimpleLime/Models/AIChat.swift
      - path: Sources/SimpleLime/Models/EditorBuffer.swift
      - path: Sources/SimpleLime/Models/EditorLanguage.swift
      - path: Sources/SimpleLime/Models/EditorWindowGroupState.swift
      - path: Sources/SimpleLime/Models/FindPanelMode.swift
      - path: Sources/SimpleLime/Models/NetworkPeer.swift
      - path: Sources/SimpleLime/Models/SearchResult.swift
      - path: Sources/SimpleLime/Models/TextRange.swift
      - path: Sources/SimpleLime/Models/TextTransform.swift
      - path: Sources/SimpleLime/Services/NetworkShareService.swift
      - path: Sources/SimpleLime/Services/SessionPersistence.swift
    dependencies:
      - package: STTextView
        product: STTextView
    settings:
      base:
        PRODUCT_NAME: SimpleLime
        PRODUCT_BUNDLE_IDENTIFIER: com.whitehappypony.SimpleLime
        MARKETING_VERSION: 0.5.0
        CURRENT_PROJECT_VERSION: 1
        DEVELOPMENT_TEAM: 525W3628D2
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: 5.9
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
    info:
      path: Generated/SimpleLimeIOS/Info.plist
      properties:
        CFBundleDisplayName: SimpleLime
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        NSLocalNetworkUsageDescription: SimpleLime uses the local network to discover and share notes with your trusted devices.
        NSBonjourServices:
          - _simplelime._tcp
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
